      <h1>小球移动重置版</h1>
      <p>经典小游戏「小球移动」的网页复刻，由 GPT-5.6 Sol 编写，发布在王雨峰的博客。保留原版的添加、点选、删除、计分、暂停和速度调节，用 Three.js 与 Rapier 3D 重建画面和物理碰撞。需要浏览器开启 JavaScript 和 WebGL。</p>
      <h2>规则</h2>
      <ul>
        <li>添加物体后开始计时；分值、尺寸、形状和速度随机。</li>
        <li>点中目标后再删除，目标分值累加到总分。</li>
        <li>没有选中时，删除最早生成的物体且不计分。</li>
        <li>点击空白区域随机扣 1–3 分，分数不会低于 0。</li>
        <li>分数正好达到 50，或等于剩余物体数量的 20 倍时获胜。</li>
      </ul>
