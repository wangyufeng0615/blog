<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>王工存储指数</title>
<meta name="description" content="DRAM、NAND、HBM 等存储指标与历史数据。">
<link rel="canonical" href="https://cun.wangyufeng.org/">
<meta property="og:type" content="website">
<meta property="og:title" content="王工存储指数">
<meta property="og:description" content="DRAM、NAND、HBM 等存储指标与历史数据。">
<meta property="og:url" content="https://cun.wangyufeng.org/">
<meta property="og:image" content="https://cun.wangyufeng.org/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="王工存储指数">
<meta name="twitter:description" content="DRAM、NAND、HBM 等存储指标与历史数据。">
<meta name="twitter:image" content="https://cun.wangyufeng.org/og.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<style>:root {
  --bg: #ffffff;
  --bg-2: #f4f5f7;
  --bg-3: #eceef1;
  --ink: #101318;
  --ink-2: #4a5160;
  --ink-3: #858c98;
  --line: #e8eaee;
  --line-2: #d6dae0;
  --up: #d4501e;
  --down: #2c6cc0;
  --flat: #9aa1ac;
  --series: #33425c;
  --ok: #2f8a4c;
  --warn: #b7791f;
  --bad: #c2362b;
  --focus: #2c6cc0;
  --radius: 6px;
  --wrap: 1120px;
  --gutter: clamp(16px, 4vw, 40px);
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115;
    --bg-2: #161920;
    --bg-3: #1d212a;
    --ink: #eceef2;
    --ink-2: #aab1bd;
    --ink-3: #737b88;
    --line: #232731;
    --line-2: #303542;
    --up: #e8683a;
    --down: #5a93e0;
    --flat: #6d7581;
    --series: #c6cdd9;
    --ok: #4fb36d;
    --warn: #d69e3a;
    --bad: #e5624f;
    --focus: #5a93e0;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 72px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.6 var(--sans);
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: inherit; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.num { font-variant-numeric: tabular-nums; }

/* 顶部的冷热细线：热层在左，冷层在右 */
.thermal {
  height: 3px;
  background: linear-gradient(90deg, var(--up) 0%, #d9913a 38%, #8f9aa6 62%, var(--down) 100%);
}

/* 顶栏 */
.bar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line);
}
.bar-inner {
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 0 var(--gutter);
  height: 56px;
  display: flex;
  align-items: center;
  gap: 28px;
}
.brand {
  font-weight: 650;
  font-size: 16px;
  letter-spacing: .04em;
  text-decoration: none;
  white-space: nowrap;
}
.nav {
  display: flex;
  gap: 2px;
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }
.nav a {
  flex: none;
  padding: 6px 10px;
  border-radius: var(--radius);
  color: var(--ink-2);
  font-size: 13.5px;
  text-decoration: none;
  white-space: nowrap;
}
.nav a:hover { background: var(--bg-2); color: var(--ink); }
.nav a[aria-current="true"] { color: var(--ink); background: var(--bg-2); }
.nav a small { color: var(--ink-3); margin-left: 4px; font-size: 12px; }

.btn {
  flex: none;
  height: 32px;
  padding: 0 12px;
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--ink);
  font-size: 13.5px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn:disabled { opacity: .45; cursor: default; }
.link-btn {
  border: 0;
  background: none;
  padding: 0;
  color: var(--ink-2);
  font-size: 13.5px;
  cursor: pointer;
  text-decoration: underline;
  text-decoration-color: var(--line-2);
  text-underline-offset: 3px;
}
.link-btn:hover { color: var(--ink); text-decoration-color: currentColor; }

main, .foot { max-width: var(--wrap); margin: 0 auto; padding: 0 var(--gutter); }

/* 首屏：周期状态 */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
  gap: clamp(28px, 5vw, 72px);
  padding: clamp(40px, 7vw, 88px) 0 clamp(36px, 5vw, 64px);
  border-bottom: 1px solid var(--line);
}
.eyebrow { margin: 0 0 18px; font-size: 13px; color: var(--ink-3); letter-spacing: .06em; }
.state {
  margin: 0;
  font-size: clamp(64px, 11vw, 112px);
  line-height: .98;
  font-weight: 650;
  letter-spacing: .02em;
}
.state-line {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 22px 0 0;
  font-size: 13.5px;
  color: var(--ink-2);
}
.split {
  display: inline-flex;
  height: 8px;
  width: 120px;
  gap: 2px;
}
.split span { border-radius: 2px; }
.headline { margin: 20px 0 0; font-size: 17px; line-height: 1.7; color: var(--ink); max-width: 30em; }
.facts {
  display: grid;
  grid-template-columns: repeat(3, auto);
  justify-content: start;
  gap: 8px 36px;
  margin: 32px 0 0;
}
.facts div { min-width: 0; }
.facts dt { font-size: 12.5px; color: var(--ink-3); }
.facts dd { margin: 2px 0 0; font-size: 20px; font-weight: 600; }
.facts dd small { font-size: 13px; font-weight: 400; color: var(--ink-3); margin-left: 3px; }

.signals { margin: 0; min-width: 0; }
.signals figcaption { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; margin-bottom: 14px; }
.signals figcaption b { font-weight: 600; font-size: 14.5px; }
.signals figcaption span { font-size: 12.5px; color: var(--ink-3); }
.sig-list { list-style: none; margin: 0; padding: 0; }
.sig {
  display: grid;
  grid-template-columns: minmax(96px, 150px) minmax(0, 1fr);
  align-items: center;
  gap: 14px;
  height: 36px;
  border-radius: var(--radius);
  cursor: pointer;
}
.sig:hover .sig-name, .sig:focus-visible .sig-name { color: var(--ink); }
.sig:hover .sig-track, .sig:focus-visible .sig-track { background: var(--bg-2); }
.sig-name { font-size: 13.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sig-track { position: relative; height: 100%; border-radius: 4px; }
.sig-plot { position: absolute; top: 0; bottom: 0; }
.sig-zero { position: absolute; top: 4px; bottom: 4px; width: 1px; background: var(--line-2); }
.sig-bar { position: absolute; top: 50%; height: 12px; margin-top: -6px; }
.sig-bar.up { background: var(--up); border-radius: 0 4px 4px 0; }
.sig-bar.down { background: var(--down); border-radius: 4px 0 0 4px; }
.sig-bar.flat { background: var(--flat); width: 2px !important; }
.sig-val {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12.5px;
  color: var(--ink-2);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.pending { margin: 14px 0 0; font-size: 12.5px; color: var(--ink-3); line-height: 1.7; }
.pending { display: flex; flex-wrap: wrap; gap: 4px 20px; }
.pending button { font-size: 12.5px; }
.legend { display: inline-flex; align-items: flex-start; gap: 7px; }
.legend .cyc { margin-top: .62em; }
.legend .cyc, .r-title .cyc { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
.legend .cyc.pending, .r-title .cyc.pending { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }

/* 分组 */
.group { padding: clamp(40px, 6vw, 72px) 0 8px; }
.group-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 16px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--ink);
}
.group-head h2 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: .03em; }
.group-head p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-2); }
.group-head .count { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }

/* 指标行 */
.row { border-bottom: 1px solid var(--line); }
.row-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 150px 128px 150px 20px;
  align-items: center;
  gap: 20px;
  width: 100%;
  min-height: 76px;
  padding: 12px 8px;
  margin: 0 -8px;
  width: calc(100% + 16px);
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
  border-radius: var(--radius);
}
.row-head:hover { background: var(--bg-2); }
.row.open .row-head { background: none; }
.r-name { min-width: 0; }
.r-title { display: flex; align-items: center; gap: 8px; font-size: 15.5px; line-height: 1.45; }
.r-meta { display: block; margin-top: 3px; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-meta .aged { color: var(--warn); }
.r-value { text-align: right; line-height: 1.2; }
.r-value b { display: block; font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.005em; }
.r-value small { display: block; margin-top: 3px; font-size: 12px; color: var(--ink-3); }
.r-trend { text-align: right; line-height: 1.3; font-variant-numeric: tabular-nums; }
.r-trend span { display: inline-flex; align-items: center; gap: 6px; font-size: 14.5px; }
.r-trend small { display: block; margin-top: 3px; font-size: 12px; color: var(--ink-3); }
.dir { display: inline-block; width: 9px; height: 9px; flex: none; }
.dir.up { background: var(--up); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.dir.down { background: var(--down); clip-path: polygon(0 0, 100% 0, 50% 100%); }
.dir.flat { background: var(--flat); height: 2px; border-radius: 1px; }
.r-spark { display: block; height: 36px; }
.r-spark svg { display: block; width: 100%; height: 36px; overflow: visible; }
.chev {
  width: 9px;
  height: 9px;
  border-right: 1.5px solid var(--ink-3);
  border-bottom: 1.5px solid var(--ink-3);
  transform: rotate(45deg) translate(-2px, -2px);
  transition: transform .18s ease;
  justify-self: center;
}
.row.open .chev { transform: rotate(-135deg) translate(-2px, -2px); }

/* 展开的详情 */
.row-body { padding: 4px 0 36px; }
.detail {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 40px;
}
.d-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--radius); padding: 2px; gap: 2px; }
.seg button {
  border: 0;
  background: none;
  height: 28px;
  padding: 0 12px;
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-2);
  cursor: pointer;
}
.seg button:hover { color: var(--ink); background: var(--bg-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.d-stat { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.plot { position: relative; }
.plot svg { display: block; width: 100%; overflow: visible; }
.plot:focus-visible { outline-offset: 6px; }
.plot .empty { display: grid; place-items: center; height: 180px; color: var(--ink-3); font-size: 13.5px; background: var(--bg-2); border-radius: var(--radius); }
.facts-list { margin: 0; display: grid; gap: 14px; align-content: start; }
.facts-list div { display: grid; gap: 2px; }
.facts-list dt { font-size: 12px; color: var(--ink-3); }
.facts-list dd { margin: 0; font-size: 14px; color: var(--ink); overflow-wrap: anywhere; }
.facts-list dd .sub { color: var(--ink-3); }
.d-wide { grid-column: 1 / -1; }
.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.notes li { position: relative; padding-left: 14px; font-size: 13px; color: var(--ink-2); line-height: 1.65; }
.notes li::before { content: ""; position: absolute; left: 0; top: .72em; width: 5px; height: 5px; border-radius: 50%; background: var(--line-2); }
.actions { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; padding-top: 16px; border-top: 1px solid var(--line); }
.fold { border-top: 1px solid var(--line); }
.fold summary {
  list-style: none;
  cursor: pointer;
  padding: 12px 0;
  font-size: 13.5px;
  color: var(--ink-2);
  display: flex;
  justify-content: space-between;
}
.fold summary::-webkit-details-marker { display: none; }
.fold summary::after { content: "展开"; color: var(--ink-3); font-size: 12.5px; }
.fold[open] summary::after { content: "收起"; }
.fold summary:hover { color: var(--ink); }
.fold > div { padding: 0 0 16px; font-size: 13.5px; color: var(--ink-2); line-height: 1.75; }
.fold p { margin: 0 0 8px; }
.records { max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); }
.records table { width: 100%; border-collapse: collapse; font-size: 13px; }
.records th, .records td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); }
.records th { position: sticky; top: 0; background: var(--bg-2); font-weight: 500; color: var(--ink-2); }
.records td:nth-child(2) { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.records th:nth-child(2) { text-align: right; }
.records tr:last-child td { border-bottom: 0; }

/* 自研情绪的分解 */
.custom { display: grid; gap: 20px; }
.custom-top { display: flex; flex-wrap: wrap; gap: 8px 32px; align-items: baseline; font-size: 13.5px; color: var(--ink-2); }
.gauge { position: relative; height: 34px; margin-top: 4px; }
.gauge-track { position: absolute; left: 0; right: 0; top: 12px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--down), var(--bg-3) 50%, var(--up)); opacity: .55; }
.gauge-mid { position: absolute; left: 50%; top: 8px; width: 1px; height: 14px; background: var(--ink-3); }
.gauge-dot { position: absolute; top: 9px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--bg); }
.gauge-scale { position: absolute; left: 0; right: 0; top: 22px; display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.stats div { background: var(--bg); padding: 12px 14px; }
.stats dt { font-size: 12px; color: var(--ink-3); }
.stats dd { margin: 3px 0 0; font-size: 17px; font-weight: 600; }
.parts { display: grid; gap: 10px; }
.part { display: grid; grid-template-columns: 88px minmax(0, 1fr) 150px; align-items: center; gap: 14px; font-size: 13.5px; }
.part-label { color: var(--ink-2); }
.part-bar { height: 8px; background: var(--bg-3); border-radius: 4px; overflow: hidden; }
.part-bar i { display: block; height: 100%; background: var(--series); border-radius: 0 4px 4px 0; }
.part-val { text-align: right; font-variant-numeric: tabular-nums; }
.part-val small { color: var(--ink-3); margin-left: 6px; }
.formula { margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.7; }
.quotes { display: grid; gap: 12px; }
.quote { margin: 0; padding: 12px 16px; border-left: 2px solid var(--line-2); background: var(--bg-2); border-radius: 0 var(--radius) var(--radius) 0; }
.quote p { margin: 0 0 6px; color: var(--ink); font-size: 14px; }
.quote cite { font-style: normal; font-size: 12.5px; color: var(--ink-3); }

/* 数据来源 */
.sources { padding: clamp(48px, 7vw, 88px) 0 24px; }
.src-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.src-table th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--ink-3); padding: 12px 12px 10px 0; border-bottom: 1px solid var(--line); }
.src-table td { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.src-table td.num, .src-table th.num { white-space: nowrap; }
.state-dot { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.state-dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.state-dot.fresh::before { background: var(--ok); }
.state-dot.watch::before { background: var(--warn); }
.state-dot.stale::before { background: var(--bad); }

.foot { padding-top: 40px; padding-bottom: calc(48px + env(safe-area-inset-bottom)); color: var(--ink-3); font-size: 12.5px; line-height: 1.8; }
.foot p { margin: 0; }

/* 图表 */
.axis text { fill: var(--ink-3); font-size: 11.5px; font-family: var(--sans); font-variant-numeric: tabular-nums; }
.grid line { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
.mid line { stroke: var(--line-2); }
.line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark-line { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.dot { fill: var(--series); stroke: var(--bg); stroke-width: 2; }
.dot.end { fill: var(--series); }
.spark-end { fill: var(--ink); stroke: var(--bg); stroke-width: 2; }
.cross { stroke: var(--ink-3); stroke-width: 1; shape-rendering: crispEdges; }
.hit { fill: transparent; }

.tip {
  position: fixed;
  z-index: 50;
  pointer-events: none;
  min-width: 132px;
  max-width: 260px;
  padding: 9px 11px;
  background: var(--ink);
  color: var(--bg);
  border-radius: var(--radius);
  font-size: 12.5px;
  line-height: 1.5;
  box-shadow: 0 6px 24px rgb(0 0 0 / .16);
}
.tip b { display: block; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tip span { display: block; opacity: .72; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translate(-50%, 16px);
  margin: 0;
  padding: 9px 14px;
  border-radius: var(--radius);
  background: var(--ink);
  color: var(--bg);
  font-size: 13.5px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.noscript { max-width: var(--wrap); margin: 0 auto; padding: 24px var(--gutter); }

@media (max-width: 960px) {
  .hero { grid-template-columns: 1fr; }
  .detail { grid-template-columns: 1fr; gap: 24px; }
}
@media (max-width: 760px) {
  body { font-size: 14.5px; }
  .bar-inner { gap: 12px; height: 52px; }
  .brand { font-size: 15px; }
  .facts { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 16px; }
  .facts dd { font-size: 18px; }
  .row-head {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "name value" "spark trend";
    gap: 8px 16px;
    padding: 14px 8px;
  }
  .r-name { grid-area: name; }
  .r-value { grid-area: value; }
  .r-trend { grid-area: trend; align-self: center; }
  .r-spark { grid-area: spark; height: 28px; }
  .r-spark svg { height: 28px; }
  .chev { display: none; }
  .r-meta { white-space: normal; }
  .part { grid-template-columns: 72px minmax(0, 1fr); }
  .part-val { grid-column: 2; text-align: left; }
  .src-table .hide-sm { display: none; }
  .group-head h2 { font-size: 20px; }
  .sig { grid-template-columns: minmax(84px, 112px) minmax(0, 1fr); gap: 10px; }
  .sig-name { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
@media print {
  .bar, .toast, .tip, .thermal { display: none; }
}
</style>
</head>

<script>/* Pure data helpers also run under Node for contract tests. No network writes. */
const StorageData = (() => {
  const DAY = 86400000;
  const today = () => new Intl.DateTimeFormat('sv-SE', {timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const stamp = d => Date.parse(d + 'T00:00:00Z');
  function freshness(item, now = today()) {
    const age = (stamp(now) - stamp(item.date)) / DAY;
    if (!Number.isFinite(age) || age < 0) return {status:'unknown',label:'日期待核对'};
    const status = age <= item.fresh_days ? 'fresh' : age <= item.watch_days ? 'watch' : 'stale';
    return {status,label:`${age} 天前 · ${ {fresh:'周期内',watch:'留意',stale:'偏旧'}[status]}`};
  }
  function windowPoints(item, days, now = today()) {
    const end = stamp(now), start = days === 'all' ? -Infinity : end - Number(days) * DAY;
    return item.points.filter(p => stamp(p.date) >= start && stamp(p.date) <= end);
  }
  function transform(points, mode) {
    if (mode === 'raw') return points;
    if (!points.length || points[0].value <= 0) return [];
    return points.map(p => ({...p,value:p.value / points[0].value * 100}));
  }
  function change(points) {
    if (points.length < 2 || points[0].value <= 0) return null;
    return (points.at(-1).value / points[0].value - 1) * 100;
  }
  function movement(item, points) {
    if (points.length < 2) return null;
    return item.custom ? {value:points.at(-1).value-points[0].value,unit:'分'} :
      (change(points) === null ? null : {value:change(points),unit:'%'});
  }
  function csvCell(value) {
    let s = String(value ?? '');
    if (/^[=+@\-\t\r]/.test(s)) s = "'" + s;
    return '"' + s.replaceAll('"','""') + '"';
  }
  function csv(item, points) {
    const rows = [['indicator','date','value','unit','source','source_url','sample'],
      ...points.map(p => [item.title,p.date,p.value,item.metric.normalized_unit,item.metric.source_name,item.metric.source_url,p.sample])];
    return '\uFEFF' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  }
  return {today,stamp,freshness,windowPoints,transform,change,movement,csv};
})();
if (typeof module !== 'undefined') module.exports = StorageData;

  /* 横轴刻度按时间取：首尾写完整日期，中间用月初（跨度短时用每两周），离首尾太近的去掉 */

    const X = t => x1 === x0 ? (m.l + w - m.r) / 2 : m.l + (t - x0) / (x1 - x0) * (w - m.l - m.r);
    const Y = v => m.t + (hi - v) / (hi - lo || 1) * (h - m.t - m.b);
    const xTicks = timeTicks(x0, x1, X, w - m.l - m.r);
    let s = `<svg viewBox="0 0 ${w} ${h}" height="${h}" role="img" aria-label="${esc(i.title)}：${pts.length} 个观测，${pts[0].date} 至 ${pts.at(-1).date}">`;
    s += '<g class="grid">' + ticks.map(t => `<line x1="${m.l}" x2="${w - m.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>`).join('') + '</g>';
    if (i.custom) s += `<g class="grid mid"><line x1="${m.l}" x2="${w - m.r}" y1="${Y(50)}" y2="${Y(50)}"/></g>`;
    s += '<g class="axis">' + ticks.map(t => `<text x="${m.l - 10}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end">${tickText(t)}</text>`).join('');
    s += xTicks.map(t => `<text x="${t.x.toFixed(1)}" y="${h - 8}" text-anchor="${t.anchor}">${t.label}</text>`).join('') + '</g>';
    if (pts.length > 1) s += `<path class="line" d="${pts.map((p, k) => (k ? 'L' : 'M') + X(xs[k]).toFixed(1) + ' ' + Y(p.value).toFixed(1)).join('')}"/>`;
    if (pts.length <= 60) s += pts.map((p, k) => k === pts.length - 1 ? '' : `<circle class="dot" cx="${X(xs[k]).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="3"/>`).join('');
    s += `<circle class="dot end" cx="${X(x1).toFixed(1)}" cy="${Y(ys.at(-1)).toFixed(1)}" r="4.5"/>`;
    s += `<line class="cross" y1="${m.t}" y2="${h - m.b}" x1="0" x2="0" style="display:none"/><circle class="dot end" r="5" cx="0" cy="0" style="display:none"/>`;
    s += `<rect class="hit" x="${m.l - 6}" y="0" width="${w - m.l - m.r + 12}" height="${h - m.b}"/></svg>`;
    box.innerHTML = s;
    box.tabIndex = 0;
    box.setAttribute('aria-label', `${i.title} 图表，可用左右方向键逐点查看`);
    const svg = box.firstChild, cross = svg.querySelector('.cross'), mark = svg.querySelectorAll('circle.dot.end')[1], hit = svg.querySelector('.hit');
    const unit = unitOf(i);
    let cur = -1;
    function focusPoint(k, clientX, clientY) {
      cur = k;
      const cx = X(xs[k]), cy = Y(ys[k]);
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.style.display = '';
      mark.setAttribute('cx', cx); mark.setAttribute('cy', cy); mark.style.display = '';
      const rect = svg.getBoundingClientRect(), scale = rect.width / w;
      const p = pts[k];
      const extra = p.sample && !/^\d{4}년/.test(p.sample) ? `<span>${esc(p.sample)}</span>` : '';
      showTip(`<b>${esc(pointText(i, p.value))}</b><span>${esc(unit)}</span><span>${esc(p.date)}</span>${extra}`,
        clientX ?? rect.left + cx * scale, clientY ?? rect.top + cy * scale);
    }
    function clear() { cur = -1; cross.style.display = 'none'; mark.style.display = 'none'; hideTip(); }
    function nearest(clientX) {
      const rect = svg.getBoundingClientRect(), px = (clientX - rect.left) * (w / rect.width);
      let best = 0; xs.forEach((t, j) => { if (Math.abs(X(t) - px) < Math.abs(X(xs[best]) - px)) best = j; });
      return best;
    }
    hit.addEventListener('pointermove', e => focusPoint(nearest(e.clientX), e.clientX, e.clientY));
    hit.addEventListener('pointerleave', clear);
    box.onkeydown = e => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        focusPoint(Math.max(0, Math.min(pts.length - 1, (cur < 0 ? pts.length - 1 : cur) + (e.key === 'ArrowLeft' ? -1 : 1))));
      } else if (e.key === 'Escape') clear();
    };
    box.onfocus = () => focusPoint(pts.length - 1);
    box.onblur = clear;
  }

  /* ---------- 首屏 ---------- */
  function renderHero() {
    const ready = (overview.ready_ids || []).map(id => byId[id]).filter(i => i && i.trend && i.trend.change_pct != null)
      .sort((a, b) => b.trend.change_pct - a.trend.change_pct);
    const up = ready.filter(i => i.trend.direction === 'up').length, down = ready.filter(i => i.trend.direction === 'down').length;
    const flat = ready.length - up - down;
    const pending = (overview.pending || []).map(p => ({item: byId[p.id], reason: p.reason})).filter(p => p.item);
    const REASON = {stale: '数据偏旧', history: '历史不足'};
    const vals = ready.map(i => i.trend.change_pct), vmax = Math.max(0, ...vals), vmin = Math.min(0, ...vals);
    const lo = vmin, hi = vmax === vmin ? vmin + 1 : vmax;
    const P = v => (v - lo) / (hi - lo) * 100;
    // 数值标签放在条形区之外的固定像素边距里，窄屏也不会溢出
    const insetL = vmin < 0 ? 52 : 0, insetR = vmax > 0 ? 56 : 0;
    const zero = P(0);
    const total = up + down + flat || 1;
    const bars = ready.map(i => {
      const v = i.trend.change_pct, a = P(Math.min(0, v)), b = P(Math.max(0, v)), dir = i.trend.direction;
      const label = dir === 'down' || v < 0
        ? `<span class="sig-val" style="right:calc(${(100 - a).toFixed(2)}% + 6px)">${pctText(v)}</span>`
        : `<span class="sig-val" style="left:calc(${b.toFixed(2)}% + 6px)">${pctText(v)}</span>`;
      return `<li class="sig" tabindex="0" data-open="${esc(i.id)}" aria-label="${esc(i.title)}，${i.trend.window_days} 天首尾 ${pctText(v)}">
        <span class="sig-name">${esc(SHORT[i.id] || i.title)}</span>
        <span class="sig-track"><span class="sig-plot" style="left:${insetL}px;right:${insetR}px"><span class="sig-zero" style="left:${zero.toFixed(2)}%"></span><span class="sig-bar ${dir}" style="left:${a.toFixed(2)}%;width:max(3px, ${(b - a).toFixed(2)}%)"></span>${label}</span></span></li>`;
    }).join('');
    $('cycle').innerHTML = `
      <div>
        <p class="eyebrow">存储周期 · 数据截至 ${esc(fmtDate(data.generated_at))}</p>
        <h1 class="state" id="cycle-state">${esc(overview.state || '—')}</h1>
        <p class="state-line"><span class="split" aria-hidden="true">
          <span style="flex:${up};background:var(--up)"></span><span style="flex:${flat};background:var(--flat)"></span><span style="flex:${down};background:var(--down)"></span></span>
          ${up} 个上行 · ${down} 个下行${flat ? ` · ${flat} 个持平` : ''}</p>
        <p class="headline">${esc(overview.headline || '')}</p>
        <dl class="facts">
          <div><dt>数据来源</dt><dd>${overview.source_count ?? '—'}<small>个</small></dd></div>
          <div><dt>当期更新</dt><dd>${overview.fresh_sources ?? '—'}<small>个</small></dd></div>
          <div><dt>留意或偏旧</dt><dd>${(overview.watch_sources ?? 0) + (overview.stale_sources ?? 0)}<small>个</small></dd></div>
        </dl>
      </div>
      <figure class="signals">
        <figcaption><b>周期信号 · 各自窗口的首尾变化</b><span>窗口 ${Math.min(...ready.map(i => i.trend.window_days))}–${Math.max(...ready.map(i => i.trend.window_days))} 天</span></figcaption>
        <ol class="sig-list">${bars}</ol>
        <p class="pending"><span class="legend"><i class="cyc"></i>参与周期判断</span>${pending.length ? `<span class="legend"><i class="cyc pending"></i><span>暂不参与判断：${pending.map(p => `<button class="link-btn" data-open="${esc(p.item.id)}">${esc(SHORT[p.item.id] || p.item.title)}</button>（${REASON[p.reason]}）`).join('、')}</span></span>` : ''}</p>
      </figure>`;
    $('cycle').querySelectorAll('.sig').forEach(el => {
      const i = byId[el.dataset.open], t = i.trend;
      const html = () => `<b>${pctText(t.change_pct)}</b><span>${esc(i.title)}</span><span>${esc(t.start)} → ${esc(t.end)} · ${t.window_days} 天</span><span>${esc(pointText(i, t.first))} → ${esc(pointText(i, t.last))} ${esc(unitOf(i))}</span>`;
      el.addEventListener('pointermove', e => showTip(html(), e.clientX, e.clientY));
      el.addEventListener('pointerleave', hideTip);
      el.addEventListener('focus', () => { const r = el.getBoundingClientRect(); showTip(html(), r.right - 40, r.top + 8); });
      el.addEventListener('blur', hideTip);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openRow(i.id, true); } });
    });
  }

  /* ---------- 指标行 ---------- */
  function rowHtml(i) {
    const f = freshness(i), t = trendParts(i);
    const aged = f.status === 'fresh' ? '' : ` · <span class="aged">${f.age} 天前</span>`;
    const why = ((overview.pending || []).find(p => p.id === i.id) || {}).reason;
    const cyc = i.cycle ? `<span class="cyc ${i.cycle}" title="${i.cycle === 'ready' ? '参与周期判断' : why === 'stale' ? '周期信号，数据偏旧，暂不参与判断' : '周期信号，历史不足，暂不参与判断'}"></span>` : '';
    return `<article class="row" id="row-${esc(i.id)}" data-indicator-id="${esc(i.id)}">
      <button class="row-head" type="button" aria-expanded="false" aria-controls="body-${esc(i.id)}">
        <span class="r-name"><span class="r-title">${cyc}<span>${esc(i.title)}</span></span>
          <span class="r-meta">${esc(sourceShort(i))} · ${esc(fmtDate(i.date))}${aged}</span></span>
        <span class="r-value"><b>${esc(valueText(i))}</b><small>${esc(unitOf(i))}</small></span>
        <span class="r-trend"><span>${t.dir ? `<i class="dir ${t.dir}" aria-label="${dirLabel(t.dir)}"></i>` : ''}${esc(t.text)}</span><small>${esc(t.sub)}</small></span>
        <span class="r-spark" data-spark="${esc(i.id)}"></span>
        <span class="chev" aria-hidden="true"></span>
      </button>
      <div class="row-body" id="body-${esc(i.id)}" role="region" aria-label="${esc(i.title)}明细" hidden></div>
    </article>`;
  }

  function renderGroups() {
    const groups = data.groups.map(g => ({...g, items: items.filter(i => i.group === g.key)})).filter(g => g.items.length);
    $('groups').innerHTML = groups.map(g => `
      <section class="group" id="g-${g.key}" aria-labelledby="h-${g.key}">
        <div class="group-head"><div><h2 id="h-${g.key}">${esc(g.title)}</h2><p>${esc(g.note)}</p></div><span class="count">${g.items.length} 项</span></div>
        ${g.items.map(rowHtml).join('')}
      </section>`).join('');
    $('nav').innerHTML = groups.map(g => `<a href="#g-${g.key}" data-nav="g-${g.key}">${esc(g.title.replace('王工自研情绪', '自研情绪').replace('供给与经营验证', '验证').replace('市场价格参考', '市场参考'))}<small>${g.items.length}</small></a>`).join('') + '<a href="#sources" data-nav="sources">来源</a>';
    document.querySelectorAll('[data-spark]').forEach(el => drawSpark(el, byId[el.dataset.spark]));

  /* ---------- 详情 ---------- */
  const RANGES = [['90', '近 3 月'], ['365', '近 1 年'], ['all', '全部']];
  function customBlock(i) {
    const c = i.custom;
    if (!c) return '';
    const v = i.metric.normalized_value;
    const gauge = typeof v === 'number' ? `<div class="gauge" aria-hidden="true"><span class="gauge-track"></span><span class="gauge-mid"></span><span class="gauge-dot" style="left:${Math.max(0, Math.min(100, v))}%"></span><span class="gauge-scale"><span>0</span><span>50 中性</span><span>100</span></span></div>` : '';
    const stats = c.stats.length ? `<dl class="stats">${c.stats.map(s => `<div><dt>${esc(s.label)}</dt><dd>${s.value == null ? '无数据' : esc(s.value)}</dd></div>`).join('')}</dl>` : '';
    const parts = c.breakdown.length ? `<div class="parts">${c.breakdown.map(p => {
      const w = p.percent != null ? p.percent : typeof p.value === 'number' ? Math.max(0, Math.min(100, p.value)) : 0;
      const note = p.contribution != null ? `对总分 ${p.contribution >= 0 ? '+' : '−'}${Math.abs(p.contribution).toFixed(2)}` : p.percent != null ? `${p.percent}%` : '';
      return `<div class="part"><span class="part-label">${esc(p.label)}</span><span class="part-bar"><i style="width:${w}%"></i></span><span class="part-val">${p.value == null ? '—' : esc(typeof p.value === 'number' ? p.value.toLocaleString('en-US', {maximumFractionDigits: 2}) : p.value)}<small>${esc(note)}</small></span></div>`;
    }).join('')}</div>` : '';
    const quotes = c.examples.length ? `<div class="quotes">${c.examples.map(e => `<blockquote class="quote"><p>${esc(e.text)}</p><cite>${safeUrl(e.url) ? `<a href="${esc(safeUrl(e.url))}" target="_blank" rel="noopener noreferrer">${esc(e.label || '原文')}</a>` : esc(e.label || '')}${e.date ? ' · ' + esc(e.date) : ''}${e.likes != null ? ' · ' + esc(e.likes) + ' 赞' : ''}</cite></blockquote>`).join('')}</div>` : '<p class="formula">当前快照未保留可链接的原始样例。</p>';
    return `<div class="d-wide custom">
      <div class="custom-top"><span>${esc(c.direction)}</span><span>${esc(c.window)}</span></div>
      ${gauge}${stats}${parts}
      <p class="formula">${esc(c.formula)}</p>
      <details class="fold"><summary>样本与原始评论</summary><div>${c.limitations.map(s => `<p>${esc(s)}</p>`).join('')}<p>下面是来源样例，不是涨跌的归因。</p>${quotes}</div></details>
    </div>`;
  }

  function detailHtml(i, days) {

    const change = mv ? `${pts.length} 个观测 · 窗口首尾 ${mv.value >= 0 ? '+' : '−'}${Math.abs(mv.value).toFixed(mv.unit === '%' && Math.abs(mv.value) >= 100 ? 0 : 1)}${mv.unit === '%' ? '%' : ' 分'}` : `${pts.length} 个观测`;
    const src = safeUrl(m.source_url);
    const trendFact = t ? `<div><dt>${t.basis === 'pipeline' ? '趋势判断' : '首尾变化'}</dt><dd>${dirLabel(t.direction)} · ${esc(trendParts(i).text)}<br><span class="sub">${esc(t.start)} → ${esc(t.end)}${t.basis === 'pipeline' ? ' · 与周期判断同一口径' : ''}</span></dd></div>` : '';
    const notes = (i.issues || []).length ? `<ul class="notes d-wide">${i.issues.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : '';
    const evid = (m.evidence || []).map(e => `<p>${safeUrl(e.source_url) ? `<a href="${esc(safeUrl(e.source_url))}" target="_blank" rel="noopener noreferrer">${esc(e.source_name || e.period || '原始证据')}</a> ` : ''}${esc(e.published_at || '')} ${esc(e.summary || '')}</p>`).join('');
    return `<div class="detail">
      <div class="d-chart">
        <div class="d-toolbar"><div class="seg" role="group" aria-label="时间窗口">${RANGES.map(([v, l]) => `<button type="button" data-range="${v}" aria-pressed="${days === v}">${l}</button>`).join('')}</div><span class="d-stat">${esc(change)}</span></div>
        <div class="plot" data-plot="${esc(i.id)}"></div>
      </div>
      <dl class="facts-list">
        <div><dt>当前值</dt><dd>${esc(valueText(i))} <span class="sub">${esc(unitOf(i))}</span></dd></div>
        ${trendFact}
        <div><dt>来源</dt><dd>${src ? `<a href="${esc(src)}" target="_blank" rel="noopener noreferrer">${esc(sourceShort(i))}</a>` : esc(sourceShort(i))}<br><span class="sub">数据日期 ${esc(fmtDate(i.date))} · ${fr}${f.status === 'fresh' ? '' : ` · ${f.age} 天前`}</span></dd></div>
        <div><dt>口径</dt><dd>${esc(MARKET[m.market_type] || m.market_type || '未记录')}<span class="sub"> · 可信度${esc(CONF[m.confidence] || m.confidence || '未记录')}</span></dd></div>
        ${i.why && !i.custom ? `<div><dt>为什么看它</dt><dd>${esc(i.why)}</dd></div>` : ''}
      </dl>
      ${customBlock(i)}
      ${notes}
      <div class="d-wide">
        <details class="fold"><summary>观测记录 · ${pts.length} 条</summary><div><div class="records"><table><thead><tr><th>日期</th><th>数值</th><th>样本 / 来源</th></tr></thead><tbody>${pts.length ? [...pts].reverse().map(p => `<tr><td>${esc(p.date)}</td><td>${esc(pointText(i, p.value))}</td><td>${esc(p.sample || sourceShort(i))}</td></tr>`).join('') : '<tr><td colspan="3">这个窗口没有观测，未补零。</td></tr>'}</tbody></table></div></div></details>
        <details class="fold"><summary>口径与原始字段</summary><div>
          ${m.methodology || i.hint ? `<p>${esc(m.methodology || i.hint)}${m.note ? ' ' + esc(m.note) : ''}</p>` : ''}
          <p>原始值 ${esc(m.raw_value ?? '—')} · 原始单位 ${esc(m.raw_unit ?? '—')}<br>来源日期 ${esc(m.source_timestamp ?? '—')} · 抓取时间 ${esc(m.fetched_at ? beijing(m.fetched_at) : '未记录')}<br>授权 ${esc(m.license_status || '未记录')}</p>
          ${evid}
          <p>折线只连接真实观测，线段不代表中间日期有数据。历史来源：${esc((i.contract && i.contract.history_source_name) || '待核对')}。</p>

        <div class="actions">
          <button type="button" class="link-btn" data-download="${days}" ${pts.length ? '' : 'disabled'}>下载这段数据 CSV</button>
          <button type="button" class="link-btn" data-link>复制这条指标的链接</button>

        </div>

  function fillDetail(row, i, days) {
    const body = row.querySelector('.row-body');
    body.innerHTML = detailHtml(i, days);
    body.dataset.days = days;
    drawChart(body.querySelector('.plot'), i, StorageData.windowPoints(i, days));
  }

  function toggleRow(row, force) {
    const i = byId[row.dataset.indicatorId], head = row.querySelector('.row-head'), body = row.querySelector('.row-body');
    const open = force ?? head.getAttribute('aria-expanded') !== 'true';
    head.setAttribute('aria-expanded', String(open));
    row.classList.toggle('open', open);
    body.hidden = !open;
    if (open && !body.dataset.days) fillDetail(row, i, 'all');
  }

  function openRow(id, scroll, instant) {
    const row = $('row-' + id);
    if (!row) return;
    toggleRow(row, true);
    const smooth = !instant && !matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (scroll) row.scrollIntoView({block: 'start', behavior: smooth ? 'smooth' : 'auto'});
  }

  /* ---------- 来源与页脚 ---------- */

    const order = {stale: 0, watch: 1, fresh: 2};
    const list = [...(data.sources || [])].sort((a, b) => (order[a.freshness] ?? 3) - (order[b.freshness] ?? 3) || String(a.source_name).localeCompare(String(b.source_name)));

      <div class="group-head"><div><h2 id="sources-title">数据来源</h2><p>公开页面低频抓取；手工维护的来源按各自的发布日期计算新鲜度。偏旧指标不参与顶部周期判断。</p></div><span class="count">${list.length} 个</span></div>
      <table class="src-table"><thead><tr><th>来源</th><th>新鲜度</th><th class="num">数据日期</th><th class="num hide-sm">抓取时间</th></tr></thead><tbody>
      ${list.map(s => `<tr><td>${safeUrl(s.source_url) ? `<a href="${esc(safeUrl(s.source_url))}" target="_blank" rel="noopener noreferrer">${esc(s.source_name)}</a>` : esc(s.source_name)}</td>

        <td class="num">${esc(s.source_timestamp || '—')}</td><td class="num hide-sm">${esc(s.fetched_at ? beijing(s.fetched_at) : '—')}</td></tr>`).join('')}
      </tbody></table>`;
    $('foot').innerHTML = `<p>${esc(overview.disclaimer || '数据仅供产业研究，不构成投资建议。')}</p><p>快照生成于 ${esc(beijing(data.generated_at))}（北京时间） · 王雨峰 · cun.wangyufeng.org</p>`;
  }

  function csvDownload(i, days) {
    const pts = StorageData.windowPoints(i, days);
    const u = URL.createObjectURL(new Blob([StorageData.csv(i, pts)], {type: 'text/csv;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = u; a.download = `${i.id}.csv`; a.click();
    setTimeout(() => URL.revokeObjectURL(u), 1000);
    toast(`已导出 ${pts.length} 条观测`);
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('click', e => {
    const opener = e.target.closest('[data-open]');
    if (opener) { hideTip(); openRow(opener.dataset.open, true); history.replaceState(null, '', '#indicator=' + encodeURIComponent(opener.dataset.open)); return; }
    const head = e.target.closest('.row-head');
    if (head) { toggleRow(head.closest('.row')); return; }
    const row = e.target.closest('.row');
    if (!row) return;
    const i = byId[row.dataset.indicatorId];
    const range = e.target.closest('[data-range]');
    if (range) { fillDetail(row, i, range.dataset.range); row.querySelector(`[data-range="${range.dataset.range}"]`).focus(); return; }
    const dl = e.target.closest('[data-download]');
    if (dl) { csvDownload(i, dl.dataset.download); return; }
    if (e.target.closest('[data-link]')) copy(SITE + '#indicator=' + encodeURIComponent(i.id), '已复制这条指标的链接');
  });
  $('share-page').addEventListener('click', () => copy(SITE, '已复制页面链接'));

  function deepLink(initial) {
    const id = new URLSearchParams(location.hash.slice(1)).get('indicator');
    if (id && byId[id]) openRow(id, true, initial === true);
  }

  let resizeTimer, lastW = innerWidth;
  addEventListener('resize', () => {
    if (innerWidth === lastW) return;
    lastW = innerWidth;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      document.querySelectorAll('[data-spark]').forEach(el => drawSpark(el, byId[el.dataset.spark]));
      document.querySelectorAll('.row.open').forEach(row => {
        const body = row.querySelector('.row-body');
        drawChart(body.querySelector('.plot'), byId[row.dataset.indicatorId], StorageData.windowPoints(byId[row.dataset.indicatorId], body.dataset.days));
      });
    }, 120);
  });
  addEventListener('scroll', hideTip, {passive: true});

  function watchNav() {
    if (!('IntersectionObserver' in window)) return;
    const links = [...document.querySelectorAll('[data-nav]')];
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (!en.isIntersecting) return;
        links.forEach(a => a.setAttribute('aria-current', String(a.dataset.nav === en.target.id)));
        const cur = links.find(a => a.dataset.nav === en.target.id);
        if (cur) cur.scrollIntoView({block: 'nearest', inline: 'nearest'});
      });
    }, {rootMargin: '-45% 0px -50% 0px'});
    document.querySelectorAll('.group, #sources').forEach(s => io.observe(s));
  }

  renderHero();
  renderGroups();
  renderSources();
  watchNav();
  if ('scrollRestoration' in history && location.hash.includes('indicator=')) history.scrollRestoration = 'manual';
  addEventListener('hashchange', () => deepLink());
  requestAnimationFrame(() => deepLink(true));
})();
</script>
</body>
</html>
