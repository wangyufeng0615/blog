  function share(id=''){const u='https://cun.wangyufeng.org/'+(id?'#indicator='+encodeURIComponent(id):'');$('share-url').value=u;$('share-note').textContent=/^(localhost|127\.)/.test(location.hostname)?'这是本地预览。复制的是正式站点链接，新设计尚未发布。':'';$('share-dialog').showModal();}
  $('rows').addEventListener('click',e=>{const range=e.target.closest('[data-range]');if(range){const i=data.items.find(i=>i.id===range.dataset.item);range.closest('.row-body').innerHTML=detail(i,range.dataset.range);return;}const dl=e.target.closest('[data-download]');if(dl){const i=data.items.find(i=>i.id===dl.dataset.download),points=StorageData.windowPoints(i,dl.dataset.days),u=URL.createObjectURL(new Blob([StorageData.csv(i,points)],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=i.id+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast(`已导出 ${points.length} 条观测`);return;}const sh=e.target.closest('[data-share-item]');if(sh)share(sh.dataset.shareItem);});
  document.querySelectorAll('[data-share]').forEach(b=>b.addEventListener('click',()=>share()));$('share-close').addEventListener('click',()=>$('share-dialog').close());
  $('copy-link').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('share-url').value);toast('链接已复制');$('share-dialog').close();}catch{$('share-url').focus();$('share-url').select();$('share-note').textContent='请选中上方链接手动复制。';}});
  window.addEventListener('hashchange',deepLink);renderRows();deepLink();
})();
</script></body></html>
