  <script>
    const DATA = JSON.parse(document.getElementById('dashboard-data').textContent);
    const MARKET = DATA.market || {};
    const MARKET_PRICES = (MARKET.prices || []).filter(row => row.date && Number.isFinite(Number(row.close)));
    const MARKET_TIMES = MARKET_PRICES.map(row => Date.parse(`${row.date}T00:00:00Z`));
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const keyOf = value => String(value || '').replace(/^@/, '').toLowerCase();
    const follower = n => Number(n || 0) >= 1e6 ? `${(n/1e6).toFixed(1)}M` : `${(n/1e3).toFixed(1)}K`;
    const percent = n => `${(Number(n || 0)*100).toFixed(1)}%`;
    const fallbackAvatar = handle => `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><rect width="96" height="96" rx="48" fill="#eef2ff"/><text x="48" y="57" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#1d4ed8">${String(handle || '?').slice(0,2).toUpperCase()}</text></svg>`)}`;
    const signed = n => Number(n) > 0 ? `+${Number(n).toFixed(1)}` : Number(n).toFixed(1);
    const tone = n => Number(n) >= 15 ? 'positive' : Number(n) <= -15 ? 'negative' : 'neutral';
    const shortDate = value => new Intl.DateTimeFormat('zh-CN', {month:'2-digit', day:'2-digit'}).format(new Date(`${value}T00:00:00Z`));
    const fullDate = value => new Intl.DateTimeFormat('zh-CN', {year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date(`${value}T00:00:00Z`));
    const marketCloseOnOrBefore = value => {
      const target = Date.parse(`${value}T23:59:59Z`);
      let match = null;
      for (let index = 0; index < MARKET_PRICES.length && MARKET_TIMES[index] <= target; index++) match = MARKET_PRICES[index];
      return match;
    };
    const actionName = action => ({buy:'买入',add:'加仓',hold:'持有',watch:'观察',reduce:'减仓',sell:'卖出',short:'做空',target:'目标价',none:'观点'}[action] || '观点');
    const byHandle = new Map();
    [...(DATA.daily_authors || []), ...(DATA.watch_daily_authors || [])].forEach(row => {
      const key = keyOf(row.handle);
      if (!byHandle.has(key)) byHandle.set(key, []);
      byHandle.get(key).push(row);
    });
    byHandle.forEach(rows => rows.sort((a,b) => a.date.localeCompare(b.date)));

    const m = DATA.metrics || {};
    document.getElementById('updated').textContent = `截至 ${DATA.window.end || '—'} · ${DATA.release?.release_id || DATA.generated_at.slice(0,10)}`;
    document.getElementById('summary').innerHTML = [
      ['样本 SSI', Number(m.evidence_ssi || 0).toFixed(1)],
      ['看多广度', `${(Number(m.bullish_breadth || 0)*100).toFixed(1)}%`],
      ['交易节点', Number(m.trade_signals || 0).toLocaleString()],
      ['样本覆盖', percent(DATA.coverage.analysis_rate)]
    ].map(([label,value]) => `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${value}</div></div>`).join('');

    document.getElementById('coverage-line').textContent = `数据截至 ${DATA.window.end || '—'} · 归档 ${Number(DATA.coverage.archived_posts || 0).toLocaleString()} 条，已分析 ${Number(DATA.coverage.analyzed_posts || 0).toLocaleString()} 条（${percent(DATA.coverage.analysis_rate)}）；非完整历史，仅反映已完成 LLM 分析的公开帖样本。`;
    document.getElementById('source-note').innerHTML = DATA.source_mode === 'official_api'
      ? `原始数据：来自 X API v2 用户时间线的本地归档，窗口 ${esc(DATA.window.start)} 至 ${esc(DATA.window.end)}。`
      : DATA.source_mode === 'mixed_free_snapshot'
        ? `原始数据：登录态公开页面快照与官方 X oEmbed 免费回补，未调用付费 X API；目标窗口 ${esc(DATA.window.start)} 至 ${esc(DATA.window.end)}，实际发现 ${esc(DATA.coverage.observed_start)} 至 ${esc(DATA.coverage.observed_end)}。DRAM ETF 叠加线来自 <a href="${esc(MARKET.product_url || '#')}" target="_blank" rel="noreferrer">Roundhill 官方日线</a>的 Primary Exchange 收盘价，上市前不回填。`
        : `原始数据：人工复核的公开原帖快照，未调用付费 X API，不代表账号完整时间线。`;
    document.getElementById('model-note').textContent = `LLM 判断：使用 ${DATA.model} 结构化判断相关性、作者立场、情绪、交易动作、目标价与时间轴标签；发布构建只接纳能与当前原始语料按帖子 ID 对齐的标注。`;
    document.getElementById('limit-note').textContent = `阅读限制：${Number(m.eligible_accounts || DATA.accounts.length)} 位 100K+ 主名单与 ${DATA.watch_accounts.length} 位精选观察分区展示；样本 SSI 与广度只使用至少有一个相关发帖日的 100K+ 账号，未分析帖子不进入指标。`;

    function eventAction(row) {
      const actions = String(row.actions || 'none').split(',').map(value => value.trim()).filter(Boolean);
      if (actions.some(value => ['sell','reduce','short'].includes(value))) return actions.find(value => ['sell','reduce','short'].includes(value));
      if (actions.some(value => ['buy','add'].includes(value))) return actions.find(value => ['buy','add'].includes(value));
      if (actions.some(value => ['hold','watch'].includes(value))) return actions.find(value => ['hold','watch'].includes(value));
      if (Number(row.trade_signals || 0) > 0) return 'target';
      return 'none';
    }
    function markerClass(action) {
      if (['buy','add'].includes(action)) return 'buy';
      if (['sell','reduce','short'].includes(action)) return 'sell';
      if (['hold','watch'].includes(action)) return 'hold';
      if (action === 'target') return 'target';
      return 'opinion';
    }
    function tradeMarker(action, x, y) {
      if (['buy','add'].includes(action)) return `<path class="trade-marker trade-up" d="M${x},${y-10} L${x+7},${y+2} L${x-7},${y+2} Z"/>`;
      if (['sell','reduce','short'].includes(action)) return `<path class="trade-marker trade-down" d="M${x-7},${y-2} L${x+7},${y-2} L${x},${y+10} Z"/>`;
      if (['hold','watch'].includes(action)) return `<path class="trade-marker trade-hold" d="M${x},${y-8} L${x+8},${y} L${x},${y+8} L${x-8},${y} Z"/>`;
      if (action === 'target') return `<circle class="trade-marker trade-target" cx="${x}" cy="${y}" r="7"/>`;
      return '';
    }
    function buildIndex(rows) {
      const events = rows.filter(row => row.show_mobile && row.annotation_label).slice(0, 5);
      return events.length ? `<ol class="event-index">${events.map((row,index) => {
        const action = eventAction(row);
        return `<li><span class="num">${index+1}</span><time>${shortDate(row.date)}</time><span class="action ${markerClass(action)}">${actionName(action)}</span><a href="${esc(row.annotation_url || '#')}" target="_blank" rel="noreferrer">${esc(row.annotation_label)}</a></li>`;
      }).join('')}</ol>` : '';
    }

    const sortAccounts = rows => [...rows].sort((a,b) => {
      const bHasSample = (byHandle.get(keyOf(b.handle)) || []).length > 0 ? 1 : 0;
      const aHasSample = (byHandle.get(keyOf(a.handle)) || []).length > 0 ? 1 : 0;
      return bHasSample - aHasSample || Number(b.followers || 0) - Number(a.followers || 0);
    });
    const mainAccounts = sortAccounts(DATA.accounts || [])
      .map((account,index) => ({...account, _chartIndex:index}));
    const watchAccounts = sortAccounts(DATA.watch_accounts || [])
      .map((account,index) => ({...account, _chartIndex:mainAccounts.length+index}));
    const DISPLAY_ACCOUNTS = [...mainAccounts, ...watchAccounts];

    function authorMarkup(account) {
      const index = account._chartIndex;
      const rows = byHandle.get(keyOf(account.handle)) || [];
      const latest = rows.at(-1);
      const hasSample = rows.length > 0;
      const watch = account.cohort === 'candidate';
      const summary = hasSample ? (account.author_summary || account.latest_claim || '') : '';
      const metaParts = [
        `<a href="https://x.com/${encodeURIComponent(account.handle)}" target="_blank" rel="noreferrer">@${esc(account.handle)}</a>`,
        `${follower(account.followers)} 关注者`,
        `覆盖 ${percent(account.analysis_rate)}`,
        esc(account.expertise_category || '综合观察')
      ];
      return `<article class="author-row" id="author-${encodeURIComponent(keyOf(account.handle))}" data-handle="${esc(account.handle)}">
        <div class="identity"><img class="avatar" src="${account.avatar_data_uri || fallbackAvatar(account.handle)}" alt="${esc(account.author)} 头像"><div class="id-text"><h2 class="author-name">${esc(account.author)}</h2><div class="author-meta">${metaParts.join(' · ')}</div>${summary ? `<p class="author-summary">${esc(summary)}</p>` : ''}</div></div>
        <div class="chart-shell"><div class="chart" id="chart-${index}"></div><div class="tooltip" id="tip-${index}"></div></div>
        <div class="score"><div class="score-value ${hasSample ? tone(latest?.adjusted_sentiment ?? account.adjusted_sentiment) : 'neutral'}">${hasSample ? signed(latest?.adjusted_sentiment ?? account.adjusted_sentiment) : '—'}</div><div class="score-label">${hasSample ? shortDate(latest.date) : '暂无样本'}</div></div>
        ${buildIndex(rows)}
      </article>`;
    }

    function cohortMarkup(title, countNote, accounts) {
      if (!accounts.length) return '';
      return `<h2 class="cohort-title">${esc(title)}<span class="count">（${accounts.length}${countNote ? ' · ' + esc(countNote) : ''}）</span></h2>${accounts.map(authorMarkup).join('')}`;
    }

    document.getElementById('authors').innerHTML =
      cohortMarkup('核心大V', '构成样本 SSI', mainAccounts)
      + cohortMarkup('精选观察', '不计入指数', watchAccounts);
    document.getElementById('account-links').innerHTML = DISPLAY_ACCOUNTS.map(account =>
      `<a href="#author-${encodeURIComponent(keyOf(account.handle))}">@${esc(account.handle)}</a>`
    ).join('');

    function placeAnnotations(points, mobile, plot, height) {
      const candidates = points.filter(point => point.row.annotation_label && (mobile ? point.row.show_mobile : point.row.show_desktop));
      const laneYs = mobile ? [10, 38, height-58, height-28] : [0, 36, height-70, height-34];
      const laneLastRight = laneYs.map(() => -Infinity);
      return candidates.map((point,index) => {
        const label = point.row.annotation_label;
        const width = mobile ? 64 : Math.min(220, Math.max(88, label.length * 12 + 20));
        const heightBox = mobile ? 24 : 34;
        const preferred = point.y < (plot.top + plot.bottom)/2 ? [2,3,0,1] : [0,1,2,3];
        const left = Math.max(plot.left, Math.min(point.x - width/2, plot.right - width));
        const lane = preferred.find(value => left > laneLastRight[value] + 8);
        if (lane === undefined) return null;
        laneLastRight[lane] = left + width;
        const top = laneYs[lane];
        const bottomLane = lane >= 2;
        const anchorY = bottomLane ? top : top + heightBox;
        const elbowY = bottomLane ? point.y + 13 : point.y - 13;
        const action = eventAction(point.row);
        return {point, left, top, width, heightBox, anchorY, elbowY, action, className: markerClass(action), index};
      }).filter(Boolean);
    }

    function renderChart(target, rows, cardIndex, account) {
      const mobile = window.matchMedia('(max-width: 720px)').matches;
      const width = Math.max(280, Math.round(target.getBoundingClientRect().width));
      if (!rows.length) {
        target.innerHTML = `<div class="empty-chart">本窗口无存储相关样本</div>`;
        target._chartState = {rows: [], points: [], width, height: mobile ? 112 : 120, cardIndex};
        return;
      }
      const height = mobile ? 260 : 300;
      const plot = {left: mobile ? 30 : 46, right: width-(mobile ? 38 : 52), top: mobile ? 52 : 60, bottom: mobile ? 214 : 252};
      const times = rows.map(row => Date.parse(`${row.date}T00:00:00Z`));
      const domainTimes = [...times, ...MARKET_TIMES];
      const minTime = Math.min(...domainTimes), maxTime = Math.max(...domainTimes);
      const x = value => maxTime === minTime ? (plot.left+plot.right)/2 : plot.left + (value-minTime)/(maxTime-minTime)*(plot.right-plot.left);
      const y = value => plot.top + (100-Number(value))/200*(plot.bottom-plot.top);
      const points = rows.map((row,index) => ({row, x:x(times[index]), y:y(row.adjusted_sentiment)}));
      const grid = [100,50,0,-50,-100].map(value => `<line class="${value===0?'zero-line':'grid-line'}" x1="${plot.left}" x2="${plot.right}" y1="${y(value)}" y2="${y(value)}"/><text class="axis-label" x="${plot.left-8}" y="${y(value)+3}" text-anchor="end">${value>0?'+':''}${value}</text>`).join('');
      const path = points.map((point,index) => `${index?'L':'M'}${point.x.toFixed(1)},${point.y.toFixed(1)}`).join(' ');
      const closes = MARKET_PRICES.map(row => Number(row.close));
      const hasMarket = closes.length > 0;
      const closeMin = hasMarket ? Math.min(...closes) : 0, closeMax = hasMarket ? Math.max(...closes) : 1;
      const closePad = Math.max(1, (closeMax-closeMin)*.08);
      const priceFloor = closeMin-closePad, priceCeiling = closeMax+closePad;
      const priceY = value => plot.top + (priceCeiling-Number(value))/(priceCeiling-priceFloor)*(plot.bottom-plot.top);
      const pricePath = hasMarket ? MARKET_PRICES.map((row,index) => `${index?'L':'M'}${x(MARKET_TIMES[index]).toFixed(1)},${priceY(row.close).toFixed(1)}`).join(' ') : '';
      const priceTicks = [closeMax, (closeMin+closeMax)/2, closeMin];
      const priceAxis = hasMarket ? priceTicks.map(value => `<text class="price-axis-label" x="${plot.right+7}" y="${priceY(value)+3}" text-anchor="start">$${value.toFixed(0)}</text>`).join('') : '';
      const tickCount = mobile ? 4 : 6;
      const tickTimes = Array.from({length:tickCount}, (_,index) => tickCount === 1 ? minTime : minTime + index*(maxTime-minTime)/(tickCount-1));
      const tickLabels = tickTimes.map((value,index) => {
        const anchor = index===0 ? 'start' : index===tickTimes.length-1 ? 'end' : 'middle';
        const date = new Date(value).toISOString().slice(0,10);
        return `<text class="axis-label" x="${x(value)}" y="${plot.bottom+20}" text-anchor="${anchor}">${shortDate(date)}</text>`;
      }).join('');
      const annotations = placeAnnotations(points, mobile, plot, height);
      const annotationSvg = annotations.map(annotation => {
        const {point,left,top,width:boxWidth,heightBox,anchorY,elbowY,action,className} = annotation;
        const anchorX = Math.max(left+8, Math.min(point.x, left+boxWidth-8));
        const labelMarkup = mobile
          ? `<text class="label" x="${left+7}" y="${top+16}">${annotation.index+1} · ${shortDate(point.row.date)}</text>`
          : `<text class="kicker" x="${left+7}" y="${top+11}">${shortDate(point.row.date)} · ${actionName(action)}</text><text class="label" x="${left+7}" y="${top+26}">${esc(point.row.annotation_label)}</text>`;
        return `<g class="annotation ${className}"><path class="annotation-connector" d="M${point.x},${point.y} L${point.x},${elbowY} L${anchorX},${elbowY} L${anchorX},${anchorY}"/><rect x="${left}" y="${top}" width="${boxWidth}" height="${heightBox}" rx="3"/>${labelMarkup}</g>`;
      }).join('');
      const marks = points.map((point,index) => {
        const action = eventAction(point.row);
        return `<g class="point-group" tabindex="0" role="button" aria-label="${fullDate(point.row.date)}，情绪 ${signed(point.row.adjusted_sentiment)}，${esc(point.row.latest_claim)}" data-card="${cardIndex}" data-index="${index}"><circle class="hit-point" cx="${point.x}" cy="${point.y}" r="22"/><circle class="point" cx="${point.x}" cy="${point.y}" r="4"/>${tradeMarker(action,point.x,point.y)}</g>`;
      }).join('');
      target.innerHTML = `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="${esc(account.author || account.name || account.handle)} 的存储情绪轨迹与 DRAM ETF 收盘价对照">${grid}<path class="price-line" d="${pricePath}"/>${priceAxis}<path class="series-line" d="${path}"/>${marks}${annotationSvg}${tickLabels}</svg>`;
      target._chartState = {rows, points, width, height, cardIndex};
    }

    function showTip(group, persistent=false) {
      const cardIndex = Number(group.dataset.card);
      const index = Number(group.dataset.index);
      const target = document.getElementById(`chart-${cardIndex}`);
      const state = target._chartState;
      const row = state.rows[index], point = state.points[index];
      const tip = document.getElementById(`tip-${cardIndex}`);
      const sourceUrl = row.annotation_url || row.post_url;
      const market = marketCloseOnOrBefore(row.date);
      tip.innerHTML = `<strong>${fullDate(row.date)} · ${signed(row.adjusted_sentiment)}</strong>${esc(row.latest_claim)}<br>证据 ${Number(row.evidence_quality).toFixed(1)} · 动作 ${actionName(eventAction(row))}${row.tickers!=='—'?` · ${esc(row.tickers)}`:''}${market?`<br>DRAM 最近收盘 ${esc(market.date)} · $${Number(market.close).toFixed(2)}`:''}${sourceUrl?`<br><a href="${esc(sourceUrl)}" target="_blank" rel="noreferrer">查看原帖 ↗</a>`:''}`;
      const halfTip = Math.min(160, Math.max(0, state.width / 2 - 10));
      const clampedX = Math.max(halfTip + 8, Math.min(point.x, state.width - halfTip - 8));
      tip.style.left = `${clampedX/state.width*100}%`;
      tip.style.top = `${point.y/state.height*100}%`;
      tip.classList.add('show');
      if (persistent) {
        document.querySelectorAll('.point-group.selected').forEach(node => node.classList.remove('selected'));
        group.classList.add('selected');
        tip.dataset.persistent = 'true';
      }
    }
    function bindInteractions() {
      document.querySelectorAll('.point-group').forEach(group => {
        group.addEventListener('mouseenter', () => showTip(group));
        group.addEventListener('focus', () => showTip(group));
        group.addEventListener('click', event => { event.stopPropagation(); showTip(group,true); });
        group.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            event.stopPropagation();
            showTip(group,true);
          }
        });
        group.addEventListener('mouseleave', () => {
          const tip = document.getElementById(`tip-${group.dataset.card}`);
          if (tip.dataset.persistent !== 'true') tip.classList.remove('show');
        });
        group.addEventListener('blur', () => {
          const tip = document.getElementById(`tip-${group.dataset.card}`);
          if (tip.dataset.persistent !== 'true') tip.classList.remove('show');
        });
      });
    }
    function renderAll() {
      DISPLAY_ACCOUNTS.forEach(account => {
        const index = account._chartIndex;
        renderChart(document.getElementById(`chart-${index}`), byHandle.get(keyOf(account.handle)) || [], index, account);
      });
      bindInteractions();
    }
    let resizeTimer;
    window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderAll, 120); });
    document.addEventListener('click', () => {
      document.querySelectorAll('.tooltip.show').forEach(tip => { tip.classList.remove('show'); delete tip.dataset.persistent; });
      document.querySelectorAll('.point-group.selected').forEach(node => node.classList.remove('selected'));
    });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') document.body.click(); });
    try {
      renderAll();
    } catch (error) {
      document.body.dataset.renderError = `${error.name}: ${error.message}`;
      console.error('dashboard render failed', error);
    }
  </script>
</body>
</html>
