<!doctype html>
<html lang="{{htmlLang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="keywords" content="{{keywords}}">
<meta name="author" content="王雨峰 (Wang Yufeng)">
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1">
<meta name="theme-color" content="#faf9f7">
<link rel="canonical" href="{{url}}">
<link rel="alternate" hreflang="zh-CN" href="{{urlZh}}">
<link rel="alternate" hreflang="en" href="{{urlEn}}">
<link rel="alternate" hreflang="x-default" href="{{urlZh}}">
<link rel="alternate" type="text/plain" title="llms.txt" href="{{urlZh}}llms.txt">
<link rel="alternate" type="application/json" title="Clue graph (JSON)" href="{{urlZh}}graph.json">
<link rel="icon" href="/avatar.jpg" type="image/jpeg">
<meta property="og:type" content="article">
<meta property="og:site_name" content="王雨峰的博客 · Wang Yufeng">
<meta property="og:title" content="{{socialTitle}}">
<meta property="og:description" content="{{socialDesc}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{imageAlt}}">
<meta property="og:locale" content="{{ogLocale}}">
<meta property="og:locale:alternate" content="{{ogAlt}}">
<meta property="article:published_time" content="2026-10-14T21:00:00+08:00">
<meta property="article:modified_time" content="2026-10-14T23:30:00+08:00">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{socialTitle}}">
<meta name="twitter:description" content="{{socialDesc}}">
<meta name="twitter:image" content="{{image}}">
<meta name="twitter:image:alt" content="{{imageAlt}}">
<script>
/* Follow the reader's language on first visit; an explicit switch is remembered. Crawlers stay on the URL they asked for. */
(function () {
  var page = '{{pageLang}}', other = '{{otherPath}}';
  try {
    var saved = localStorage.getItem('owc-lang');
    var want = saved;
    if (!want) {
      if (/bot|crawl|spider|slurp|preview|headless|lighthouse|google|bing|baidu|yandex|duckduck|bytespider|gpt|claude|anthropic|perplexity|facebookexternalhit|embedly/i.test(navigator.userAgent)) return;
      var first = (navigator.languages && navigator.languages[0]) || navigator.language || '';
      want = /^zh/i.test(first) ? 'zh' : 'en';
    }
    if (want !== page) location.replace(other + location.hash);
  } catch (e) {}
})();
</script>
<script type="application/ld+json">
{{jsonld}}
</script>
<link rel="stylesheet" href="{{assets}}graph.css?v={{vCss}}">
</head>
<body>
<header class="top">
  <div class="title-row">
    <h1>{{h1}}</h1>
    <a class="lang" href="{{switchHref}}" hreflang="{{switchHreflang}}" lang="{{switchHreflang}}" data-lang="{{switchLang}}">{{switchLabel}}</a>
  </div>
  <p class="what">{{what}}</p>
  <div class="legend">
    {{legend}}
    <span class="spoiler">{{spoiler}}</span>
  </div>
</header>

<div class="stage" id="stage">
  <svg id="graph" role="img" aria-label="{{aria}}"></svg>
  <div class="zoom" role="group">
    <button type="button" id="z-out" aria-label="{{zoomOut}}">−</button>
    <output id="z-val">100%</output>
    <button type="button" id="z-in" aria-label="{{zoomIn}}">+</button>
    <button type="button" id="z-fit">{{fit}}</button>
    <span class="hint">{{hint}}</span>
  </div>
  <aside class="detail" id="detail" aria-live="polite" hidden></aside>
</div>
<noscript>
  <div class="noscript">
    <p>{{noscript}}</p>
    {{noscriptList}}
  </div>
</noscript>

<main class="article">
  <h2>{{faqTitle}}</h2>
  <dl class="faq">
{{faq}}
  </dl>

  <h2>{{srcTitle}}</h2>
  <p class="src">{{src}}</p>
  <p class="src">{{agents}}</p>
  <p class="src">{{byline}}</p>
</main>

<script>
document.querySelector('.lang').addEventListener('click', function () {
  try { localStorage.setItem('owc-lang', this.dataset.lang); } catch (e) {}
});
</script>
<script src="{{assets}}graph-data.js?v={{vData}}"></script>
<script src="{{assets}}graph.js?v={{vJs}}"></script>
</body>
</html>
